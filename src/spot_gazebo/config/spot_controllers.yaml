controller_manager:
  ros__parameters:
    update_rate: 2000
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    spot_joint_controller:
      type: pid_controller/PidController


joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100.0


spot_joint_controller:
  ros__parameters:
    dof_names:
      - fl_hx
      - fl_hy
      - fl_kn
      - fr_hx
      - fr_hy
      - fr_kn
      - hl_hx
      - hl_hy
      - hl_kn
      - hr_hx
      - hr_hy
      - hr_kn

    command_interface: effort

    reference_and_state_interfaces:
      - position
      - velocity

    # On activation, avoid a transient before the first 50 Hz q_ref message.
    set_current_state_as_first_setpoint: true

    # Approved Spot V3 servo:
    #   tau = 300 * (q_ref - q) - 40 * qdot
    #   hips:  +/-45 N*m
    #   knees: +/-115 N*m
    # qdot_ref is expected to be zero.
    gains:
      fl_hx:
        p: 300.0
        i: 0.0
        d: 40.0
        u_clamp_min: -45.0
        u_clamp_max: 45.0

      fl_hy:
        p: 300.0
        i: 0.0
        d: 40.0
        u_clamp_min: -45.0
        u_clamp_max: 45.0

      fl_kn:
        p: 300.0
        i: 0.0
        d: 40.0
        u_clamp_min: -115.0
        u_clamp_max: 115.0

      fr_hx:
        p: 300.0
        i: 0.0
        d: 40.0
        u_clamp_min: -45.0
        u_clamp_max: 45.0

      fr_hy:
        p: 300.0
        i: 0.0
        d: 40.0
        u_clamp_min: -45.0
        u_clamp_max: 45.0

      fr_kn:
        p: 300.0
        i: 0.0
        d: 40.0
        u_clamp_min: -115.0
        u_clamp_max: 115.0

      hl_hx:
        p: 300.0
        i: 0.0
        d: 40.0
        u_clamp_min: -45.0
        u_clamp_max: 45.0

      hl_hy:
        p: 300.0
        i: 0.0
        d: 40.0
        u_clamp_min: -45.0
        u_clamp_max: 45.0

      hl_kn:
        p: 300.0
        i: 0.0
        d: 40.0
        u_clamp_min: -115.0
        u_clamp_max: 115.0

      hr_hx:
        p: 300.0
        i: 0.0
        d: 40.0
        u_clamp_min: -45.0
        u_clamp_max: 45.0

      hr_hy:
        p: 300.0
        i: 0.0
        d: 40.0
        u_clamp_min: -45.0
        u_clamp_max: 45.0

      hr_kn:
        p: 300.0
        i: 0.0
        d: 40.0
        u_clamp_min: -115.0
        u_clamp_max: 115.0
