amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map

    scan_topic: /scan

    robot_model_type: "nav2_amcl::OmniMotionModel"

    laser_model_type: "likelihood_field"
    laser_min_range: 0.10
    laser_max_range: 12.0
    max_beams: 60

    min_particles: 500
    max_particles: 2000

    tf_broadcast: true
    transform_tolerance: 1.0

    update_min_d: 0.10
    update_min_a: 0.10

    resample_interval: 1

    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    topic_name: map
    frame_id: map
